{% extends "base.html" %}
{% block title %}Reset Password | TutorSetu{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 460px;">
    <div class="ts-card p-4">
        <h1 class="h4 fw-bold text-center mb-3">Forgot your password?</h1>
        <p class="small text-muted-ts">Enter your account email. If an account exists, we'll send reset instructions.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_email">Email</label>
                <input type="email" name="email" class="form-control" id="id_email" required autocomplete="email">
            </div>
            <button class="btn btn-ts-primary w-100" type="submit">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
