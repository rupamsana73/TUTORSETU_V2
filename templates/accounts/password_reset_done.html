{% extends "base.html" %}
{% block title %}Check your email | TutorSetu{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 460px;">
    <div class="ts-card p-4">
        <div class="feature-icon mx-auto mb-3"><i class="bi bi-envelope-check"></i></div>
        <h1 class="h4 fw-bold">Check your email</h1>
        <p class="small text-muted-ts mb-0">If an account exists for that email, password reset instructions have been sent.</p>
        <a class="btn btn-ts-outline btn-sm mt-3" href="{% url 'accounts:login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}
